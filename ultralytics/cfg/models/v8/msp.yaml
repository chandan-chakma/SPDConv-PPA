# YOLOv8-MSP: FINAL WORKING VERSION
# Uses simple args - let parse_model handle the rest

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f_MSP, [128]] # 2 - MSP (SIMPLE: just c2)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f_MSP, [256]] # 4 - MSP (SIMPLE: just c2)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6 - Standard C2f
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8 - Standard C2f
  - [-1, 1, SPPF, [1024, 5]] # 9

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14
  - [-1, 3, C2f, [256]] # 15 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 2], 1, Concat, [1]] # 17
  - [-1, 3, C2f_MSP, [128]] # 18 (P2/4) - MSP for tiny objects

  - [-1, 1, Conv, [128, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20
  - [-1, 3, C2f, [256]] # 21 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23
  - [-1, 3, C2f, [512]] # 24 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 9], 1, Concat, [1]] # 26
  - [-1, 3, C2f, [1024]] # 27 (P5/32)

  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
