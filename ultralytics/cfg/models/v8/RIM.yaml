# YOLOv8-RIM model configuration
# Parameters
nc: 80  # number of classes
scales:  # model compound scaling constants
  n: [0.33, 0.25, 1024]  # YOLOv8n
  s: [0.33, 0.50, 1024]  # YOLOv8s
  m: [0.67, 0.75, 768]   # YOLOv8m
  l: [1.00, 1.00, 512]   # YOLOv8l
  x: [1.00, 1.25, 512]   # YOLOv8x

# YOLOv8.0n backbone with RIM enhancements
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 3, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C2f, [128, True]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C2f_RIM, [256, True]],  # 4 - RIM enhanced C2f
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 6, C2f_RIM, [512, True]],  # 6 - RIM enhanced C2f
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C2f_RIM, [1024, True]],  # 8 - RIM enhanced C2f
   [-1, 1, SPPF, [1024, 5]],  # 9
   [-1, 1, LightweightINR, [1024, 512, 1024]],  # 10 - Implicit representation
  ]

# YOLOv8.0n head with RIM enhancements
head:
  [[-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C2f, [512]],  # 13
   [-1, 1, RecursiveMambaBlock, [512]],  # 14 - Recursive Mamba
   
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C2f, [256]],  # 17 (P3/8-small)
   [-1, 1, AdaptiveFrequencyGate, [256]],  # 18 - Frequency gate
   
   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 14], 1, Concat, [1]],  # cat head P4
   [-1, 3, C2f, [512]],  # 21 (P4/16-medium)
   [-1, 1, RecursiveMambaBlock, [512]],  # 22
   
   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 10], 1, Concat, [1]],  # cat head P5
   [-1, 3, C2f, [1024]],  # 25 (P5/32-large)
   [-1, 1, AdaptiveFrequencyGate, [1024]],  # 26
   
   [[18, 22, 26], 1, Detect, [nc]],  # Detect(P3, P4, P5)
  ]