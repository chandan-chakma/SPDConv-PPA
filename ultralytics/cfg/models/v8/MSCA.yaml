# MSCA-YOLO Configuration
nc: 10  # number of classes
scales:
  n: [0.33, 0.25, 1024]  # [depth, width, max_channels]

# Backbone with PCFA (MSCABlock)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, MSCABlock, [128]]  # 3-PCFA enhancement for P2
  
  - [-1, 1, Conv, [256, 3, 2]]  # 4-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, MSCABlock, [256]]  # 6-PCFA enhancement for P3
  
  - [-1, 1, Conv, [512, 3, 2]]  # 7-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, MSCABlock, [512]]  # 9-PCFA enhancement for P4
  
  - [-1, 1, Conv, [1024, 3, 2]]  # 10-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]  # 12

# Head with HSFPN (using ADAF for fusion)
head:
  # Top-down pathway with ADAF
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 9], 1, ADAFFusion, [512]]  # 14-ADAF P5->P4
  - [-1, 3, C2f, [512]]
  - [-1, 1, MSCABlock, [512]]  # 16-PCFA enhancement
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, ADAFFusion, [256]]  # 18-ADAF P4->P3
  - [-1, 3, C2f, [256]]
  - [-1, 1, MSCABlock, [256]]  # 20-PCFA enhancement
  
  # Additional P2 level for tiny objects (CRITICAL)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 3], 1, ADAFFusion, [128]]  # 22-ADAF P3->P2
  - [-1, 3, C2f, [128]]
  - [-1, 1, MSCABlock, [128]]  # 24-PCFA enhancement (critical for 6-8px)
  
  # Bottom-up pathway
  - [-1, 1, Conv, [128, 3, 2]]  # 25
  - [[-1, 20], 1, Concat, [1]]  # 26-concat with P3
  - [-1, 3, C2f, [256]]  # 27
  
  - [-1, 1, Conv, [256, 3, 2]]  # 28
  - [[-1, 16], 1, Concat, [1]]  # 29-concat with P4
  - [-1, 3, C2f, [512]]  # 30
  
  - [-1, 1, Conv, [512, 3, 2]]  # 31
  - [[-1, 12], 1, Concat, [1]]  # 32-concat with P5
  - [-1, 3, C2f, [1024]]  # 33

  # 4-scale detection: P2, P3, P4, P5
  - [[24, 27, 30, 33], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)