# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-GeoCon: Geographic Context-Aware YOLO for Small Object Detection
# Novel approach for overhead/satellite imagery

# Parameters
nc: 80  # number of classes (will be overridden by dataset)
scales:  # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n-GeoCon
  s: [0.33, 0.50, 1024]  # YOLOv8s-GeoCon
  m: [0.67, 0.75, 768]   # YOLOv8m-GeoCon
  l: [1.00, 1.00, 512]   # YOLOv8l-GeoCon
  x: [1.00, 1.25, 512]   # YOLOv8x-GeoCon

# YOLOv8-GeoCon backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f_GeoCon, [128, True]]  # 2 - GeoCon for small objects
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f_GeoCon, [256, True]]  # 4 - GeoCon for multi-scale
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f_GeoCon, [512, True]]  # 6 - GeoCon for medium objects
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]  # 8 - Standard for large objects
  - [-1, 1, SPPF, [1024, 5]]  # 9

# YOLOv8-GeoCon head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [512]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [256]]  # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [512]]  # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [1024]]  # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)